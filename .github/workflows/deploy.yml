name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar

      - name: Create Release and upload jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="deploy-$(date +%Y%m%d-%H%M%S)"
          JAR_FILE=$(ls build/libs/Inquisition-*.jar)
          JAR_SIZE=$(stat -c%s "$JAR_FILE")
          echo "Creating release $TAG with jar ($JAR_SIZE bytes)"
          gh release create "$TAG" "$JAR_FILE" --title "Deploy $TAG" --notes "Auto deploy from CI"
