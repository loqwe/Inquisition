name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar

      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          for name in SSH_KEY SERVER_HOST SERVER_USER; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: missing secret $name"
              exit 1
            fi
          done

          JAR_FILE=$(ls build/libs/Inquisition-*.jar)
          JAR_SIZE=$(stat -c%s "$JAR_FILE")
          SSH_KEY_PATH="$HOME/.ssh/deploy_key"

          echo "Secret lengths: SERVER_HOST=${#SERVER_HOST}, SERVER_USER=${#SERVER_USER}, SSH_KEY=$(printf '%s' "$SSH_KEY" | wc -c)"
          ssh -V || true

          run_debug() {
            local label="$1"
            shift
            local log_file
            log_file=$(mktemp)
            set +e
            "$@" >"$log_file" 2>&1
            local status=$?
            set -e
            cat "$log_file"
            if [ "$status" -ne 0 ]; then
              local summary
              summary=$(tail -n 20 "$log_file" | tr '\r\n' '  ' | sed 's/%/%25/g')
              echo "::error title=${label} failed::${summary}"
              exit "$status"
            fi
            rm -f "$log_file"
          }

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"
          ssh-keygen -y -f "$SSH_KEY_PATH" >/dev/null
          ssh-keygen -lf "$SSH_KEY_PATH" || true
          ssh-keyscan -T 10 -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true

          SSH_OPTS=(
            -vvv
            -T
            -i "$SSH_KEY_PATH"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o LogLevel=DEBUG3
            -o StrictHostKeyChecking=no
            -o ConnectTimeout=10
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
            -o PubkeyAcceptedAlgorithms=+ssh-rsa
            -o HostkeyAlgorithms=+ssh-rsa
            -o IPQoS=throughput
          )
          SCP_OPTS=(
            -v
            -i "$SSH_KEY_PATH"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=no
            -o ConnectTimeout=10
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
            -o PubkeyAcceptedAlgorithms=+ssh-rsa
            -o HostkeyAlgorithms=+ssh-rsa
            -o IPQoS=throughput
          )

          run_debug "ssh preflight" ssh "${SSH_OPTS[@]}" "${SERVER_USER}@${SERVER_HOST}" "
            set -euo pipefail
            pkill -f '/root/docker/inquisition/app/Inquisition-upload.jar' || true
            rm -f /root/docker/inquisition/app/Inquisition-upload.jar
          "

          run_debug "scp upload" scp "${SCP_OPTS[@]}" "$JAR_FILE" "${SERVER_USER}@${SERVER_HOST}:/root/docker/inquisition/app/Inquisition-upload.jar"

          run_debug "ssh deploy" ssh "${SSH_OPTS[@]}" "${SERVER_USER}@${SERVER_HOST}" "
            set -euo pipefail
            cd /root/docker/inquisition/app
            REMOTE_SIZE=\$(stat -c%s Inquisition-upload.jar)
            echo \"Uploaded: \$REMOTE_SIZE bytes, expected: ${JAR_SIZE} bytes\"
            if [ \"\$REMOTE_SIZE\" -ne \"${JAR_SIZE}\" ]; then
              echo 'ERROR: Upload size mismatch, aborting'
              rm -f Inquisition-upload.jar
              exit 1
            fi
            unzip -tqq Inquisition-upload.jar
            cp -f Inquisition.jar Inquisition.jar.bak.\$(date +%Y%m%d_%H%M%S)
            mv -f Inquisition-upload.jar Inquisition.jar
            docker stop inquisition && docker rm inquisition
            docker run -d --name inquisition --restart always -p 2000:2000 -v /root/docker/inquisition:/config -v /root/docker/inquisition/app/Inquisition.jar:/Inquisition.jar dazecake/inquisition:v1.2.8
          "
