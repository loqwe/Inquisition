name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar

      - name: Create Release and upload jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="deploy-$(date +%Y%m%d-%H%M%S)"
          JAR_FILE=$(ls build/libs/Inquisition-*.jar)
          JAR_SIZE=$(stat -c%s "$JAR_FILE")
          echo "Creating release $TAG with jar ($JAR_SIZE bytes)"
          gh release create "$TAG" "$JAR_FILE" --title "Deploy $TAG" --notes "Auto deploy from CI"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "JAR_SIZE=$JAR_SIZE" >> $GITHUB_ENV

      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TAG: ${{ env.TAG }}
          JAR_SIZE: ${{ env.JAR_SIZE }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          REPO="${{ github.repository }}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${SERVER_USER}@${SERVER_HOST}" "
            cd /root/docker/inquisition/app
            wget -q -O Inquisition-new.jar 'https://github.com/${REPO}/releases/download/${TAG}/Inquisition-1.3.1.jar'
            REMOTE_SIZE=\$(stat -c%s Inquisition-new.jar)
            echo \"Downloaded: \$REMOTE_SIZE bytes, expected: ${JAR_SIZE} bytes\"
            if [ \"\$REMOTE_SIZE\" -lt 1000000 ]; then
              echo 'ERROR: Download too small, aborting'
              rm -f Inquisition-new.jar
              exit 1
            fi
            cp -f Inquisition.jar Inquisition.jar.bak.\$(date +%Y%m%d_%H%M%S)
            mv -f Inquisition-new.jar Inquisition.jar
            docker stop inquisition && docker rm inquisition
            rm -f /root/docker/inquisition/data.json
            docker run -d --name inquisition --restart always -p 2000:2000 -v /root/docker/inquisition:/config -v /root/docker/inquisition/app/Inquisition.jar:/Inquisition.jar dazecake/inquisition:v1.2.8
          "
